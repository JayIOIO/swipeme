<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>swipe to see magic</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@600;700&display=swap" rel="stylesheet">
    <style>
        /* Reset and full-viewport lock */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #020612;
            touch-action: none; /* Prevent pull-to-refresh or scrolling on swipe */
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            font-family: 'Fira Code', monospace;
            cursor: crosshair;
        }
    </style>
</head>
<body>
    
    <canvas id="asciiCanvas"></canvas>

    <script>
        /**
         * Winter Magic - Full-Screen 3D Interactive ASCII Christmas Scene
         * Volumetric 3D projection for the Christmas tree, spiraling tinsel,
         * 3D perspective fireworks (chrysanthemum, Saturn ring, willow, strobe),
         * rising rockets, isometric gift boxes, and multi-depth snowfall.
         */
        const canvas = document.getElementById('asciiCanvas');
        const ctx = canvas.getContext('2d');

        // Dynamic ASCII grid dimensions (recomputed on resize to fill 100vw x 100vh)
        let COLS = 150;
        let ROWS = 56;
        let cellW = 8;
        let cellH = 14;
        let fontSize = 12;

        // Animation timing
        let frame = 0;
        let lastTime = 0;
        const FPS_INTERVAL = 1000 / 24; // Smooth 24 FPS ASCII animation

        // Interactive Wind & Pointer State
        let windVelocityX = 0;
        let windVelocityY = 0;
        let isPointerDown = false;
        let lastPointerX = 0;
        let lastPointerY = 0;
        let swipeDistanceAcc = 0;

        // 3D Scene Entities
        let stars = [];
        let snowflakes = [];
        let treePoints = [];
        let treeOrnaments = [];
        let rockets = [];
        let fireworks = [];
        let swipeSparks = [];

        /**
         * Clamps RGB values [0..255] and returns a CSS rgb() string
         */
        function rgb(r, g, b) {
            r = Math.max(0, Math.min(255, Math.round(r)));
            g = Math.max(0, Math.min(255, Math.round(g)));
            b = Math.max(0, Math.min(255, Math.round(b)));
            return `rgb(${r},${g},${b})`;
        }

        /**
         * Computes optimal grid columns & rows to cleanly fill 100vw x 100vh
         */
        function resizeCanvas() {
            const vw = window.innerWidth;
            const vh = window.innerHeight;
            const dpr = window.devicePixelRatio || 1;

            canvas.width = Math.floor(vw * dpr);
            canvas.height = Math.floor(vh * dpr);
            canvas.style.width = `${vw}px`;
            canvas.style.height = `${vh}px`;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            // High-density character grid for rich 3D detail
            const targetCellW = vw < 600 ? 6.0 : vw < 1100 ? 7.2 : 8.2;
            const targetCellH = targetCellW * 1.72;

            COLS = Math.max(76, Math.floor(vw / targetCellW));
            ROWS = Math.max(40, Math.floor(vh / targetCellH));

            cellW = vw / COLS;
            cellH = vh / ROWS;

            fontSize = Math.max(7, Math.floor(Math.min(cellW * 1.58, cellH * 0.94)));
            ctx.font = `700 ${fontSize}px "Fira Code", monospace`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            initStars(Math.floor((COLS * ROWS) * 0.024));
            initSnow(Math.floor((COLS * ROWS) * 0.036));
            build3DTreeModel();
        }

        /**
         * Populates twinkling stars across the upper night sky
         */
        function initStars(count) {
            stars = [];
            const starChars = ['.', '+', '*', '·', '✦'];
            const maxSkyRow = Math.floor(ROWS * 0.68);
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.floor(Math.random() * COLS),
                    y: Math.floor(Math.random() * maxSkyRow),
                    phase: Math.random() * Math.PI * 2,
                    speed: 0.1 + Math.random() * 0.2,
                    char: starChars[Math.floor(Math.random() * starChars.length)]
                });
            }
        }

        /**
         * Populates multi-depth 3D snowflakes (z in [0.25 .. 1.35])
         */
        function initSnow(count) {
            snowflakes = [];
            for (let i = 0; i < count; i++) {
                const z = 0.25 + Math.random() * 1.15;
                const char = z > 1.1 ? '@' : z > 0.85 ? '*' : z > 0.6 ? '+' : z > 0.4 ? 'o' : '.';
                snowflakes.push({
                    x: Math.random() * COLS,
                    y: Math.random() * ROWS,
                    z: z,
                    speed: (0.12 + Math.random() * 0.24) * (0.55 + z * 0.65),
                    swayPhase: Math.random() * Math.PI * 2,
                    char: char
                });
            }
        }

        /**
         * Computes tree bounds dynamically based on current ROWS and COLS
         */
        function getTreeMetrics() {
            const cx = Math.floor(COLS / 2);
            const treeTop = Math.max(5, Math.floor(ROWS * 0.13));
            const groundRow = Math.floor(ROWS * 0.81);
            const treeBottom = groundRow - 2;
            const treeHeight = Math.max(14, treeBottom - treeTop);
            const maxRadius = Math.min(COLS * 0.26, treeHeight * 0.76);
            return { cx, treeTop, treeBottom, groundRow, treeHeight, maxRadius };
        }

        /**
         * Builds a volumetric 3D point-cloud model of the multi-tiered pine tree
         * with sculpted radial boughs, snow-dusted tips, warm fairy lights,
         * and ornaments in cylindrical coordinates (height t, angle theta, radius r)
         */
        function build3DTreeModel() {
            treePoints = [];
            treeOrnaments = [];
            const { treeHeight, maxRadius } = getTreeMetrics();

            const numTiers = 7;
            const rowsPerStep = 0.42;
            const totalSteps = Math.floor(treeHeight / rowsPerStep);

            const ornamentColors = [
                [255, 55, 65],    // Ruby Red
                [255, 215, 45],   // Warm Gold
                [56, 215, 255],   // Ice Cyan
                [255, 90, 200],   // Neon Magenta
                [195, 130, 255],  // Lavender
                [255, 255, 255]   // Pearl White
            ];
            const ornamentChars = ['O', '@', '0', '◉', '✦'];

            for (let s = 0; s <= totalSteps; s++) {
                const t = s / totalSteps;
                const tierIndex = Math.floor(t * numTiers);
                const tierPos = (t * numTiers) % 1;
                // Distinct overlapping bough skirts for each tier
                const tierFlare = 0.56 + 0.52 * Math.pow(tierPos, 0.72);
                const outerR = Math.max(0.55, Math.pow(t, 0.92) * maxRadius * tierFlare);

                const circumferenceSteps = Math.max(12, Math.floor(outerR * 7.8));
                for (let a = 0; a < circumferenceSteps; a++) {
                    const theta = (a / circumferenceSteps) * Math.PI * 2 + tierIndex * 0.48;
                    // 7 sculpted radial bough lobes per tier with drooping tips
                    const branchLobe = Math.pow(0.5 + 0.5 * Math.cos(theta * 7 + tierIndex * 1.1), 1.4);
                    const r = outerR * (0.76 + 0.32 * branchLobe);
                    const boughDroop = branchLobe * tierPos * 1.15;
                    const yOffset = t * treeHeight + boughDroop;
                    const isSnowTip = tierPos > 0.78 && branchLobe > 0.62 && ((a + s) % 2 === 0);

                    treePoints.push({
                        r,
                        theta,
                        yOffset,
                        t,
                        tierPos,
                        branchLobe,
                        isInner: false,
                        isSnowTip
                    });

                    // Dense inner foliage core so the 3D cone feels solid from every angle
                    if (a % 2 === 0 && outerR > 1.8) {
                        treePoints.push({
                            r: r * 0.56,
                            theta: theta + 0.22,
                            yOffset: yOffset - 0.25,
                            t,
                            tierPos,
                            branchLobe: 0.4,
                            isInner: true,
                            isSnowTip: false
                        });
                    }
                }

                // Bauble ornaments & twinkling warm fairy lights suspended at branch tips
                if (t > 0.07 && t < 0.98 && s % 2 === 0) {
                    const ornCount = Math.max(1, Math.floor(outerR * 0.68));
                    for (let k = 0; k < ornCount; k++) {
                        const theta = (k / ornCount) * Math.PI * 2 + s * 1.37;
                        const branchLobe = Math.pow(0.5 + 0.5 * Math.cos(theta * 7 + tierIndex * 1.1), 1.4);
                        const r = outerR * (0.82 + 0.30 * branchLobe) * 1.03;
                        const isFairyLight = (s + k) % 2 === 0;
                        const col = isFairyLight
                            ? [255, 232, 145]
                            : ornamentColors[(s + k) % ornamentColors.length];

                        treeOrnaments.push({
                            r,
                            theta,
                            yOffset: t * treeHeight + branchLobe * tierPos * 1.15 + 0.2,
                            char: isFairyLight ? '·' : ornamentChars[(s + k) % ornamentChars.length],
                            color: col,
                            phase: Math.random() * Math.PI * 2,
                            isFairyLight
                        });
                    }
                }
            }
        }

        /**
         * Launches a rising 3D firework rocket from the ground that bursts at (targetX, targetY)
         */
        function launchRocket(targetX = null, targetY = null, scale = 1.0, forcedType = null) {
            const { groundRow } = getTreeMetrics();
            const side = Math.random() < 0.5 ? 'left' : 'right';

            const tx = targetX !== null
                ? Math.max(6, Math.min(COLS - 7, targetX))
                : (side === 'left'
                    ? Math.floor(COLS * (0.12 + Math.random() * 0.22))
                    : Math.floor(COLS * (0.66 + Math.random() * 0.22)));

            const ty = targetY !== null
                ? Math.max(4, Math.min(groundRow - 4, targetY))
                : Math.floor(ROWS * (0.14 + Math.random() * 0.28));

            const startX = tx + (Math.random() - 0.5) * 14;
            const startY = groundRow;
            const flightFrames = Math.max(8, Math.min(16, Math.floor((startY - ty) / 2.2)));

            rockets.push({
                x: startX,
                y: startY,
                z: (Math.random() - 0.5) * 0.5,
                vx: (tx - startX) / flightFrames,
                vy: (ty - startY) / flightFrames,
                age: 0,
                maxAge: flightFrames,
                targetX: tx,
                targetY: ty,
                scale,
                forcedType,
                trail: []
            });
        }

        /**
         * Spawns a true 3D volumetric firework explosion with perspective projection,
         * multiple 3D geometries (chrysanthemum, Saturn ring, willow, crackling strobe),
         * and depth-attenuated ASCII glyphs.
         */
        function spawn3DFirework(fx, fy, scale = 1.0, forcedType = null) {
            const palettes = [
                [[255, 115, 50], [255, 225, 95]],     // Sunset Amber & Gold
                [[50, 215, 255], [190, 245, 255]],    // Electric Cyan & Ice
                [[255, 75, 185], [255, 195, 235]],    // Neon Magenta & Rose
                [[100, 255, 135], [235, 255, 120]],   // Emerald & Lime
                [[255, 215, 65], [255, 255, 255]],    // Royal Gold & Diamond
                [[180, 110, 255], [90, 210, 255]]     // Cosmic Violet & Blue
            ];
            const [primaryCol, secondaryCol] = palettes[Math.floor(Math.random() * palettes.length)];
            const types = ['chrysanthemum', 'saturn', 'willow', 'strobe'];
            const type = forcedType || types[Math.floor(Math.random() * types.length)];

            const particles = [];
            const baseSpeed = Math.min(COLS, ROWS) * 0.022 * scale;
            const tiltX = (Math.random() - 0.5) * 1.1;
            const tiltZ = (Math.random() - 0.5) * 0.9;

            if (type === 'saturn') {
                const coreCount = 54;
                for (let i = 0; i < coreCount; i++) {
                    const u = Math.random();
                    const v = Math.random();
                    const theta = u * 2.0 * Math.PI;
                    const phi = Math.acos(2.0 * v - 1.0);
                    const spd = baseSpeed * (0.55 + Math.random() * 0.25);
                    particles.push({
                        x: 0, y: 0, z: 0,
                        vx: Math.sin(phi) * Math.cos(theta) * spd,
                        vy: Math.cos(phi) * spd,
                        vz: Math.sin(phi) * Math.sin(theta) * spd,
                        color: primaryCol,
                        history: [],
                        isStrobe: false
                    });
                }
                const ringCount = 64;
                for (let i = 0; i < ringCount; i++) {
                    const angle = (i / ringCount) * Math.PI * 2;
                    const spd = baseSpeed * 1.38;
                    let rx = Math.cos(angle) * spd;
                    let ry = 0;
                    let rz = Math.sin(angle) * spd;

                    const y1 = ry * Math.cos(tiltX) - rz * Math.sin(tiltX);
                    const z1 = ry * Math.sin(tiltX) + rz * Math.cos(tiltX);
                    const x2 = rx * Math.cos(tiltZ) - y1 * Math.sin(tiltZ);
                    const y2 = rx * Math.sin(tiltZ) + y1 * Math.cos(tiltZ);

                    particles.push({
                        x: 0, y: 0, z: 0,
                        vx: x2, vy: y2, vz: z1,
                        color: secondaryCol,
                        history: [],
                        isStrobe: false
                    });
                }
            } else {
                const count = type === 'willow' ? 95 : 115;
                const goldenRatio = (1 + Math.sqrt(5)) / 2;

                for (let i = 0; i < count; i++) {
                    const theta = (2 * Math.PI * i) / goldenRatio;
                    const phi = Math.acos(1 - (2 * (i + 0.5)) / count);
                    const shellRatio = (type === 'chrysanthemum' && i % 3 === 0) ? 0.62 : 1.0;
                    const spd = baseSpeed * shellRatio * (0.88 + Math.random() * 0.24);

                    particles.push({
                        x: 0, y: 0, z: 0,
                        vx: Math.sin(phi) * Math.cos(theta) * spd,
                        vy: Math.cos(phi) * spd,
                        vz: Math.sin(phi) * Math.sin(theta) * spd,
                        color: shellRatio < 0.8 ? secondaryCol : primaryCol,
                        history: [],
                        isStrobe: type === 'strobe' && i % 2 === 0
                    });
                }
            }

            fireworks.push({
                cx: fx,
                cy: fy,
                type,
                color: primaryCol,
                age: 0,
                maxAge: type === 'willow' ? 34 : 26,
                particles
            });
        }

        /**
         * Spawns sparkling trail embers along swipe gestures
         */
        function spawnSwipeTrail(gx, gy) {
            const sparkColors = [
                [255, 225, 110],
                [120, 230, 255],
                [255, 130, 210],
                [255, 255, 255]
            ];
            for (let i = 0; i < 4; i++) {
                swipeSparks.push({
                    x: gx + (Math.random() - 0.5) * 2.2,
                    y: gy + (Math.random() - 0.5) * 1.4,
                    vx: (Math.random() - 0.5) * 0.45,
                    vy: -0.15 + Math.random() * 0.35,
                    age: 0,
                    maxAge: 9 + Math.floor(Math.random() * 7),
                    color: sparkColors[Math.floor(Math.random() * sparkColors.length)]
                });
            }
        }

        /**
         * Renders a 3D isometric gift box with shaded top lid, front/side faces, and bow
         */
        function drawIsometricGift(plot, cx, baseRow, width, height, depth, boxRGB, ribbonRGB) {
            const [br, bg, bb] = boxRGB;
            const [rr, rg, rb] = ribbonRGB;

            // Ground shadow
            for (let dx = -2; dx < width + depth + 2; dx++) {
                plot(cx + dx, baseRow, -0.5, '~', rgb(18, 42, 85));
            }

            // Front face
            for (let dy = 0; dy < height; dy++) {
                for (let dx = 0; dx < width; dx++) {
                    const gx = cx + dx;
                    const gy = baseRow - height + dy;
                    const isRibbon = dx === Math.floor(width / 2) || dy === Math.floor(height / 2);
                    if (isRibbon) {
                        plot(gx, gy, 2.0, '+', rgb(rr, rg, rb));
                    } else {
                        const shade = 0.85 + 0.15 * (1 - dy / height);
                        plot(gx, gy, 1.8, '#', rgb(br * shade, bg * shade, bb * shade));
                    }
                }
            }

            // Right 3D perspective face
            for (let d = 1; d <= depth; d++) {
                const shiftY = Math.floor(d * 0.55);
                for (let dy = 0; dy < height; dy++) {
                    const gx = cx + width - 1 + d;
                    const gy = baseRow - height + dy - shiftY;
                    const isRibbon = dy === Math.floor(height / 2);
                    if (isRibbon) {
                        plot(gx, gy, 1.7, '=', rgb(rr * 0.82, rg * 0.82, rb * 0.82));
                    } else {
                        plot(gx, gy, 1.6, '%', rgb(br * 0.58, bg * 0.58, bb * 0.58));
                    }
                }
            }

            // Top 3D isometric lid
            for (let d = 0; d <= depth; d++) {
                const shiftY = Math.floor(d * 0.55);
                for (let dx = 0; dx < width; dx++) {
                    const gx = cx + dx + d;
                    const gy = baseRow - height - shiftY;
                    const isRibbon = dx === Math.floor(width / 2) || d === Math.floor(depth / 2);
                    if (isRibbon) {
                        plot(gx, gy, 2.1, '*', rgb(Math.min(255, rr * 1.1), Math.min(255, rg * 1.1), Math.min(255, rb * 1.1)));
                    } else {
                        plot(gx, gy, 1.9, '=', rgb(Math.min(255, br * 1.18), Math.min(255, bg * 1.18), Math.min(255, bb * 1.18)));
                    }
                }
            }

            // 3D Ribbon Bow on top center
            const bowX = cx + Math.floor(width / 2) + Math.floor(depth / 2);
            const bowY = baseRow - height - Math.floor(depth * 0.55) - 1;
            plot(bowX - 1, bowY, 2.3, '(', rgb(rr, rg, rb));
            plot(bowX, bowY, 2.4, '@', rgb(255, 255, 240));
            plot(bowX + 1, bowY, 2.3, ')', rgb(rr, rg, rb));
        }

        /**
         * Renders a single frame of the 3D ASCII Christmas scene with Z-buffer occlusion
         */
        function renderScene() {
            const charGrid = Array.from({ length: ROWS }, () => new Array(COLS).fill(' '));
            const colorGrid = Array.from({ length: ROWS }, () => new Array(COLS).fill('#020612'));
            const zBuffer = Array.from({ length: ROWS }, () => new Float32Array(COLS).fill(-999));

            const plot = (x, y, z, ch, col) => {
                const gx = Math.round(x);
                const gy = Math.round(y);
                if (gx >= 0 && gx < COLS && gy >= 0 && gy < ROWS) {
                    if (z >= zBuffer[gy][gx]) {
                        zBuffer[gy][gx] = z;
                        charGrid[gy][gx] = ch;
                        colorGrid[gy][gx] = col;
                    }
                }
            };

            const { cx, treeTop, treeBottom, groundRow, treeHeight, maxRadius } = getTreeMetrics();

            // 1. Night Sky Gradient, Aurora Glimmer, Multi-Layer Pine Ridge & Snowdrifts
            for (let y = 0; y < ROWS; y++) {
                const skyT = y / ROWS;
                const baseR = 3 + skyT * 14;
                const baseG = 10 + skyT * 30;
                const baseB = 30 + skyT * 66;

                for (let x = 0; x < COLS; x++) {
                    const farRidge = (groundRow - 10)
                        + 2.4 * Math.sin(0.055 * x + 0.8)
                        + 1.4 * Math.sin(0.19 * x);
                    const nearTreeline = (groundRow - 5)
                        + 1.8 * Math.sin(0.09 * x + 2.1)
                        + 1.2 * Math.sin(0.32 * x)
                        + 0.8 * Math.cos(0.75 * x);

                    if (y >= groundRow) {
                        const depthT = (y - groundRow) / Math.max(1, ROWS - groundRow);
                        const driftWave = Math.sin(x * 0.14 + y * 0.55) * 0.5 + 0.5;
                        const shimmer = 0.82 + 0.18 * Math.sin(x * 0.25 + y * 0.6 + frame * 0.08);
                        const chars = ['~', '-', '.', ':', '='];
                        const ch = chars[(x + y * 2) % chars.length];
                        const rCol = (42 + depthT * 38 + driftWave * 22) * shimmer;
                        const gCol = (92 + depthT * 52 + driftWave * 28) * shimmer;
                        const bCol = (165 + depthT * 55 + driftWave * 25) * shimmer;
                        plot(x, y, -2.0, ch, rgb(rCol, gCol, bCol));
                    } else if (y >= nearTreeline) {
                        const depth = (y - nearTreeline) / Math.max(1, groundRow - nearTreeline);
                        const ch = (x + Math.floor(nearTreeline)) % 2 === 0 ? '^' : '#';
                        plot(x, y, -3.0, ch, rgb(10 + depth * 18, 34 + depth * 45, 72 + depth * 75));
                    } else if (y >= farRidge) {
                        const depth = (y - farRidge) / Math.max(1, nearTreeline - farRidge);
                        plot(x, y, -4.0, ':', rgb(8 + depth * 10, 22 + depth * 22, 52 + depth * 35));
                    } else {
                        const aurora = Math.sin(x * 0.045 + frame * 0.03) * Math.cos(y * 0.09 - frame * 0.02);
                        if (aurora > 0.65 && y < groundRow * 0.55) {
                            plot(x, y, -5.0, '.', rgb(baseR + 12, baseG + 38, baseB + 32));
                        } else if ((x + y * 3) % 5 === 0) {
                            plot(x, y, -5.0, '.', rgb(baseR, baseG, baseB));
                        }
                    }
                }
            }

            // 2. Twinkling Stars
            for (const s of stars) {
                const twinkle = 0.5 + 0.5 * Math.sin(frame * s.speed + s.phase);
                if (twinkle > 0.25) {
                    const v = 105 + 150 * twinkle;
                    plot(s.x, s.y, -4.5, s.char, rgb(v, v, Math.min(255, v + 25)));
                }
            }

            // 3. Crescent / Full Luminous Moon & Halo (top-left)
            const mx = Math.floor(COLS * 0.16);
            const my = Math.max(5, Math.floor(ROWS * 0.15));
            const moonR = Math.max(2.3, Math.min(COLS, ROWS) * 0.045);
            const glowR = moonR * 2.7;

            for (let y = Math.max(0, Math.floor(my - glowR)); y <= Math.min(ROWS - 1, Math.ceil(my + glowR)); y++) {
                for (let x = Math.max(0, Math.floor(mx - glowR * 1.8)); x <= Math.min(COLS - 1, Math.ceil(mx + glowR * 1.8)); x++) {
                    const dx = (x - mx) * 0.56;
                    const dy = y - my;
                    const dist = Math.hypot(dx, dy);
                    if (dist < moonR) {
                        const crater = Math.sin(dx * 1.8 + dy * 1.4) > 0.45;
                        plot(x, y, -4.2, crater ? 'O' : '@', crater ? '#fef08a' : '#fffbeb');
                    } else if (dist < glowR) {
                        const glow = 1.0 - (dist - moonR) / (glowR - moonR);
                        if (((x * 7 + y * 13 + frame) % 10) < glow * 7) {
                            plot(
                                x, y, -4.3,
                                glow < 0.45 ? '.' : ':',
                                rgb(65 + 155 * glow, 100 + 140 * glow, 155 + 95 * glow)
                            );
                        }
                    }
                }
            }

            // 4. Periodic 3D Rocket Launches
            if (frame % 26 === 0 && rockets.length + fireworks.length < 4) {
                launchRocket();
            }

            // Update & Render Rising 3D Rockets
            const nextRockets = [];
            for (const rkt of rockets) {
                rkt.age += 1;
                rkt.trail.push({ x: rkt.x, y: rkt.y });
                if (rkt.trail.length > 5) rkt.trail.shift();

                rkt.x += rkt.vx;
                rkt.y += rkt.vy;

                if (rkt.age < rkt.maxAge) {
                    nextRockets.push(rkt);
                    plot(rkt.x, rkt.y, 1.5, '^', '#ffffff');
                    for (let i = 0; i < rkt.trail.length; i++) {
                        const tRatio = (i + 1) / rkt.trail.length;
                        const pt = rkt.trail[i];
                        plot(pt.x, pt.y, 1.4, tRatio > 0.5 ? '|' : ':', rgb(255 * tRatio, 195 * tRatio, 90 * tRatio));
                    }
                } else {
                    spawn3DFirework(rkt.targetX, rkt.targetY, rkt.scale, rkt.forcedType);
                }
            }
            rockets = nextRockets;

            // 5. Update & Render True 3D Perspective Fireworks
            const nextFireworks = [];
            const perspectiveFocal = 32;
            const aspectX = 1.78;

            for (const fw of fireworks) {
                fw.age += 1;
                if (fw.age <= fw.maxAge) {
                    nextFireworks.push(fw);
                    const progress = fw.age / fw.maxAge;
                    const drag = fw.type === 'willow' ? 0.91 : 0.935;
                    const gravity = fw.type === 'willow' ? 0.068 : 0.042;
                    const fade = Math.pow(1.0 - progress, fw.type === 'willow' ? 1.15 : 1.45);
                    const [defaultR, defaultG, defaultB] = fw.color || [255, 215, 65];

                    for (const p of fw.particles) {
                        const [pr, pg, pb] = p.color || [defaultR, defaultG, defaultB];
                        p.history.push({ x: p.x, y: p.y, z: p.z });
                        const maxTrail = fw.type === 'willow' ? 5 : 3;
                        if (p.history.length > maxTrail) p.history.shift();

                        p.x += p.vx;
                        p.y += p.vy;
                        p.z += p.vz;

                        p.vx *= drag;
                        p.vy = p.vy * drag + gravity;
                        p.vz *= drag;

                        if (p.isStrobe && progress > 0.45 && (frame + Math.floor(p.x)) % 3 === 0) {
                            continue;
                        }

                        // Project 3D particle trails
                        for (let h = 0; h < p.history.length; h++) {
                            const hp = p.history[h];
                            const hScale = perspectiveFocal / Math.max(8, perspectiveFocal + hp.z);
                            const sx = fw.cx + hp.x * aspectX * hScale;
                            const sy = fw.cy + hp.y * hScale;
                            const trailFade = fade * ((h + 1) / (p.history.length + 1)) * 0.65;
                            const zDepth = -0.8 - hp.z * 0.05;
                            plot(sx, sy, zDepth, '.', rgb(pr * trailFade, pg * trailFade, pb * trailFade));
                        }

                        // Project 3D particle head
                        const pScale = perspectiveFocal / Math.max(8, perspectiveFocal + p.z);
                        const sx = fw.cx + p.x * aspectX * pScale;
                        const sy = fw.cy + p.y * pScale;
                        const depthBrightness = Math.max(0.45, Math.min(1.25, pScale));
                        const totalBright = fade * depthBrightness;

                        let ch = '*';
                        if (pScale > 1.18) ch = '@';
                        else if (pScale > 1.04) ch = '#';
                        else if (progress > 0.72) ch = '+';

                        const zDepth = -0.75 - p.z * 0.05;
                        plot(sx, sy, zDepth, ch, rgb(pr * totalBright, pg * totalBright, pb * totalBright));
                    }
                }
            }
            fireworks = nextFireworks;

            // 6. Render Swipe Sparkle Trails
            const nextSparks = [];
            for (const sp of swipeSparks) {
                sp.age += 1;
                sp.x += sp.vx;
                sp.y += sp.vy;
                if (sp.age <= sp.maxAge) {
                    nextSparks.push(sp);
                    const fade = 1.0 - sp.age / sp.maxAge;
                    const [sr, sg, sb] = sp.color;
                    const ch = fade > 0.65 ? '*' : fade > 0.35 ? '+' : '.';
                    plot(sp.x, sp.y, 4.5, ch, rgb(sr * fade, sg * fade, sb * fade));
                }
            }
            swipeSparks = nextSparks;

            // 7. Volumetric 3D Christmas Tree with True Perspective Projection
            const treeSpin = frame * 0.036; // Smooth 3D turntable rotation
            const lightAngle = -0.65; // Top-left moonlight + warm front key light
            const treeFocal = Math.max(36, maxRadius * 2.55); // 3D perspective camera distance
            const cameraTilt = 0.14; // Subtle upward 3D perspective angle

            const projectTree3D = (x3d, yOffset, z3d) => {
                const persp = treeFocal / Math.max(12, treeFocal - z3d);
                return {
                    sx: cx + x3d * persp,
                    sy: treeTop + yOffset + z3d * cameraTilt * persp,
                    persp
                };
            };

            // 3D Elliptical Tree Shadow on Snow
            for (let dz = -Math.floor(maxRadius * 0.5); dz <= Math.floor(maxRadius * 0.5); dz++) {
                const shadowHalfW = Math.sqrt(Math.max(0, 1 - Math.pow(dz / (maxRadius * 0.55), 2))) * maxRadius * 1.12;
                for (let dx = -Math.floor(shadowHalfW); dx <= Math.floor(shadowHalfW); dx++) {
                    plot(cx + dx + 1, groundRow + dz * 0.18, -1.2 + dz * 0.02, '=', rgb(14, 34, 72));
                }
            }

            // 3D Cylindrical Trunk with Bark Shading & Perspective
            const trunkHalfW = Math.max(2, Math.floor(maxRadius * 0.14));
            for (let y = treeBottom - 1; y <= groundRow; y++) {
                for (let dx = -trunkHalfW; dx <= trunkHalfW; dx++) {
                    const normX = dx / trunkHalfW;
                    const zDepth = Math.sqrt(Math.max(0, 1 - normX * normX)) * trunkHalfW * 0.85;
                    const { sx, sy } = projectTree3D(dx, y - treeTop, zDepth);
                    const barkShade = 0.62 + 0.38 * (1 - Math.abs(normX + 0.28));
                    plot(
                        sx,
                        sy,
                        zDepth + 0.5,
                        dx % 2 === 0 ? '|' : '#',
                        rgb(128 * barkShade, 74 * barkShade, 34 * barkShade)
                    );
                }
            }

            // Render Volumetric 3D Pine Needles & Snow-Dusted Branch Tips
            const foliageGlyphs = ['#', '%', '*', '^', '/'];
            for (const pt of treePoints) {
                const worldTheta = pt.theta + treeSpin;
                const x3d = Math.cos(worldTheta) * pt.r;
                const z3d = Math.sin(worldTheta) * pt.r;
                const { sx, sy, persp } = projectTree3D(x3d, pt.yOffset, z3d);

                // 3D Directional, Rim & Depth Lighting
                const keyLight = 0.5 + 0.5 * Math.cos(worldTheta - lightAngle);
                const frontLight = 0.5 + 0.5 * Math.sin(worldTheta);
                const tierShadow = 0.64 + 0.36 * pt.tierPos;
                const lobeHighlight = 0.82 + 0.24 * pt.branchLobe;
                const innerDim = pt.isInner ? 0.46 : 1.0;
                const depthBoost = Math.max(0.62, Math.min(1.22, persp));

                const shade = (0.35 + 0.42 * keyLight + 0.25 * frontLight) * tierShadow * lobeHighlight * innerDim * depthBoost;

                if (pt.isSnowTip && z3d > -maxRadius * 0.35) {
                    const snowShade = 0.72 + 0.28 * keyLight;
                    plot(
                        sx,
                        sy,
                        z3d + 1.08,
                        z3d > 0 ? '*' : '.',
                        rgb(195 * snowShade, 228 * snowShade, 255 * snowShade)
                    );
                } else {
                    const rVal = 12 + shade * 42;
                    const gVal = 62 + shade * 178;
                    const bVal = 30 + shade * 68;

                    let ch = '#';
                    if (pt.isInner) {
                        ch = ':';
                    } else if (pt.tierPos > 0.84) {
                        ch = x3d < 0 ? '/' : '\\';
                    } else if (keyLight > 0.76 && z3d > 0) {
                        ch = '*';
                    } else {
                        ch = foliageGlyphs[Math.abs(Math.floor(pt.yOffset + x3d)) % foliageGlyphs.length];
                    }

                    plot(sx, sy, z3d + 1.0, ch, rgb(rVal, gVal, bVal));
                }
            }

            // Dual 3D Spiraling Garlands (Golden Tinsel + Crimson Velvet Ribbon)
            const spiralTurns = 4.5;
            const spiralSteps = Math.floor(treeHeight * 13);
            for (let i = 0; i <= spiralSteps; i++) {
                const t = i / spiralSteps;
                const tierPos = (t * 7) % 1;
                const tierFlare = 0.62 + 0.46 * Math.pow(tierPos, 0.72);
                const baseR = (0.45 + Math.pow(t, 0.92) * maxRadius * tierFlare) * 1.05;

                // 1) Golden Tinsel Strand
                const thetaGold = t * spiralTurns * Math.PI * 2 + treeSpin * 1.15;
                const gx3d = Math.cos(thetaGold) * baseR;
                const gz3d = Math.sin(thetaGold) * baseR;
                const gProj = projectTree3D(gx3d, t * treeHeight + 0.2, gz3d);

                const shimmer = 0.76 + 0.24 * Math.sin(frame * 0.26 + i * 0.22);
                const gDepthBright = gz3d >= 0 ? Math.min(1.2, gProj.persp) : 0.42;
                const gChar = gz3d >= 0 ? (i % 2 === 0 ? '~' : '*') : '.';

                plot(
                    gProj.sx,
                    gProj.sy,
                    gz3d + 1.22,
                    gChar,
                    rgb(255 * shimmer * gDepthBright, 218 * shimmer * gDepthBright, 65 * shimmer * gDepthBright)
                );

                // 2) Counter-phased Crimson Velvet Ribbon Strand
                if (t > 0.08 && t < 0.96) {
                    const thetaRed = thetaGold + Math.PI;
                    const rx3d = Math.cos(thetaRed) * (baseR * 1.01);
                    const rz3d = Math.sin(thetaRed) * (baseR * 1.01);
                    const rProj = projectTree3D(rx3d, t * treeHeight + 0.35, rz3d);
                    const rDepthBright = rz3d >= 0 ? Math.min(1.15, rProj.persp) : 0.38;
                    plot(
                        rProj.sx,
                        rProj.sy,
                        rz3d + 1.2,
                        rz3d >= 0 ? '=' : '-',
                        rgb(235 * rDepthBright, 38 * rDepthBright, 68 * rDepthBright)
                    );
                }
            }

            // 3D Surface Ornaments & Twinkling Fairy Lights with Specular Highlights
            for (const orn of treeOrnaments) {
                const worldTheta = orn.theta + treeSpin;
                const x3d = Math.cos(worldTheta) * orn.r;
                const z3d = Math.sin(worldTheta) * orn.r;

                if (z3d > -maxRadius * 0.28) {
                    const { sx, sy, persp } = projectTree3D(x3d, orn.yOffset, z3d);
                    const pulse = 0.68 + 0.32 * Math.sin(frame * (orn.isFairyLight ? 0.36 : 0.22) + orn.phase);
                    const depthFade = z3d >= 0 ? Math.min(1.2, persp) : 0.55;
                    const [or, og, ob] = orn.color;

                    if (orn.isFairyLight) {
                        const glowChar = pulse > 0.88 ? '*' : pulse > 0.62 ? '+' : '·';
                        plot(sx, sy, z3d + 1.38, glowChar, rgb(or * pulse * depthFade, og * pulse * depthFade, ob * pulse * depthFade));
                    } else if (pulse > 0.94 && z3d > 0.5) {
                        plot(sx, sy, z3d + 1.4, '*', '#ffffff');
                    } else {
                        plot(sx, sy, z3d + 1.34, orn.char, rgb(or * pulse * depthFade, og * pulse * depthFade, ob * pulse * depthFade));
                    }
                }
            }

            // 8. Faceted 3D Rotating Bethlehem Star Topper with Volumetric Rays
            const starPulse = 0.82 + 0.18 * Math.sin(frame * 0.28);
            const starAngle = frame * 0.075;
            const starY = treeTop - 1;
            const starCol = rgb(255, 240 * starPulse, 95 * starPulse);
            const starGold = rgb(245 * starPulse, 185 * starPulse, 40 * starPulse);

            // 3D Rotating Star Points
            const starTips = [
                { x: 0, y: -1.6, z: 0, ch: '|' },
                { x: 0, y: 1.4, z: 0, ch: '|' },
                { x: 2.3, y: 0, z: 0, ch: '-' },
                { x: -2.3, y: 0, z: 0, ch: '-' },
                { x: 0, y: 0, z: 2.3, ch: '*' },
                { x: 0, y: 0, z: -2.3, ch: '+' },
                { x: 1.3, y: -1.1, z: 0.8, ch: '/' },
                { x: -1.3, y: -1.1, z: -0.8, ch: '\\' },
                { x: 1.3, y: 1.1, z: -0.8, ch: '\\' },
                { x: -1.3, y: 1.1, z: 0.8, ch: '/' }
            ];

            plot(cx, starY, 6.2, '@', '#ffffff');
            for (const tip of starTips) {
                const rx = tip.x * Math.cos(starAngle) - tip.z * Math.sin(starAngle);
                const rz = tip.x * Math.sin(starAngle) + tip.z * Math.cos(starAngle);
                const persp = treeFocal / Math.max(12, treeFocal - rz);
                const sx = cx + rx * persp;
                const sy = starY + tip.y * persp;
                plot(sx, sy, 5.8 + rz * 0.2, tip.ch, rz >= 0 ? starCol : starGold);
            }

            // 9. 3D Isometric Gift Boxes Clustered Around the Tree Base
            const giftScale = Math.max(0.75, Math.min(1.25, COLS / 135));
            const gw1 = Math.max(6, Math.round(9 * giftScale));
            const gh1 = Math.max(3, Math.round(5 * giftScale));
            const gw2 = Math.max(5, Math.round(7 * giftScale));
            const gh2 = Math.max(3, Math.round(4 * giftScale));

            drawIsometricGift(
                plot,
                cx - Math.round(maxRadius * 0.92) - gw1,
                groundRow,
                gw1, gh1, 3,
                [220, 38, 38], [250, 204, 21]
            );
            drawIsometricGift(
                plot,
                cx - Math.round(maxRadius * 0.42) - gw2,
                groundRow + 1,
                gw2, gh2, 2,
                [37, 99, 235], [255, 255, 255]
            );
            drawIsometricGift(
                plot,
                cx + Math.round(maxRadius * 0.25),
                groundRow + 1,
                gw2, gh2, 2,
                [219, 39, 119], [253, 224, 71]
            );
            drawIsometricGift(
                plot,
                cx + Math.round(maxRadius * 0.65),
                groundRow,
                gw1, gh1, 3,
                [22, 163, 74], [255, 255, 255]
            );

            // 10. Multi-Depth 3D Falling Snowflakes (Interactive Wind-Driven)
            windVelocityX *= 0.93;
            windVelocityY *= 0.93;

            for (const flake of snowflakes) {
                flake.y += flake.speed + windVelocityY * flake.z * 0.4;
                flake.x += (Math.sin(frame * 0.065 + flake.swayPhase) * 0.22 + windVelocityX) * flake.z;

                if (flake.y >= ROWS) {
                    flake.y -= ROWS;
                    flake.x = Math.random() * COLS;
                } else if (flake.y < 0) {
                    flake.y += ROWS;
                }
                if (flake.x >= COLS) flake.x -= COLS;
                if (flake.x < 0) flake.x += COLS;

                const snowZ = flake.z > 0.85 ? 4.2 : -1.5;
                const bright = Math.floor(145 + flake.z * 85);
                plot(flake.x, flake.y, snowZ, flake.char, rgb(bright, Math.min(255, bright + 12), 255));
            }

            // 11. Render ASCII Buffer to Full-Viewport Canvas
            ctx.fillStyle = '#020612';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let y = 0; y < ROWS; y++) {
                const py = y * cellH + cellH * 0.5;
                const rowChars = charGrid[y];
                const rowCols = colorGrid[y];
                for (let x = 0; x < COLS; x++) {
                    const ch = rowChars[x];
                    if (ch !== ' ') {
                        ctx.fillStyle = rowCols[x];
                        ctx.fillText(ch, x * cellW + cellW * 0.5, py);
                    }
                }
            }
        }

        /**
         * Main animation loop locked to smooth ASCII frame rate
         */
        function animate(timestamp) {
            requestAnimationFrame(animate);
            if (timestamp - lastTime < FPS_INTERVAL) return;
            lastTime = timestamp;

            renderScene();
            frame += 1;
        }

        /**
         * Converts client screen coordinates (px) to ASCII grid coordinates (col, row)
         */
        function clientToGrid(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const gx = Math.floor(((clientX - rect.left) / rect.width) * COLS);
            const gy = Math.floor(((clientY - rect.top) / rect.height) * ROWS);
            return {
                gx: Math.max(2, Math.min(COLS - 3, gx)),
                gy: Math.max(2, Math.min(ROWS - 3, gy))
            };
        }

        // --- Pure Click & Swipe Gestures (Zero UI) ---
        canvas.addEventListener('pointerdown', (e) => {
            isPointerDown = true;
            lastPointerX = e.clientX;
            lastPointerY = e.clientY;
            swipeDistanceAcc = 0;

            const { gx, gy } = clientToGrid(e.clientX, e.clientY);
            spawn3DFirework(gx, gy, 1.05);
            spawnSwipeTrail(gx, gy);
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!isPointerDown) return;

            const dx = e.clientX - lastPointerX;
            const dy = e.clientY - lastPointerY;
            const dist = Math.hypot(dx, dy);

            windVelocityX = Math.max(-2.6, Math.min(2.6, windVelocityX + dx * 0.015));
            windVelocityY = Math.max(-1.0, Math.min(1.6, windVelocityY + dy * 0.008));

            const { gx, gy } = clientToGrid(e.clientX, e.clientY);
            spawnSwipeTrail(gx, gy);

            swipeDistanceAcc += dist;
            if (swipeDistanceAcc > 46) {
                swipeDistanceAcc = 0;
                spawn3DFirework(gx, gy, 0.78);
            }

            lastPointerX = e.clientX;
            lastPointerY = e.clientY;
        });

        window.addEventListener('pointerup', () => {
            isPointerDown = false;
        });

        window.addEventListener('pointercancel', () => {
            isPointerDown = false;
        });

        window.addEventListener('resize', resizeCanvas);

        // Initialize on load
        window.onload = function () {
            resizeCanvas();
            launchRocket(Math.floor(COLS * 0.22), Math.floor(ROWS * 0.24), 1.0, 'saturn');
            launchRocket(Math.floor(COLS * 0.78), Math.floor(ROWS * 0.22), 1.05, 'chrysanthemum');
            requestAnimationFrame(animate);
        };
    </script>
   
</body>
</html>
